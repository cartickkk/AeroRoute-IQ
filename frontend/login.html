<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Login | AeroRoute IQ</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Supabase CDN (Official Standalone UMD Build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

  <!-- Stylesheets (Absolute Root Paths for Vercel Compatibility) -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-body">

  <!-- Top Navigation Header -->
  <header class="auth-nav">
    <div class="brand">
      <h1 class="brand-title">AeroRoute-IQ</h1>
      <span class="auth-id-badge">TECHFEST: 2026</span>
    </div>
  </header>

  <!-- Main Login Card Container -->
  <main class="auth-container">
    <div class="auth-card">
      <h2 class="auth-heading">Operator Login</h2>

      <!-- Alert Banner -->
      <div id="authAlert" class="auth-alert hidden"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <!-- Email Input -->
        <div id="groupEmail" class="form-group">
          <label for="loginEmail">Email Address</label>
          <input 
            type="email" 
            id="loginEmail" 
            class="auth-input" 
            placeholder="operator@aeroroute.gov" 
            autocomplete="email"
            required 
          />
        </div>

        <!-- Password Input with Toggle -->
        <div id="groupPassword" class="form-group">
          <label for="loginPassword" id="passwordLabel">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="loginPassword" 
              class="auth-input" 
              placeholder="••••••••" 
              autocomplete="current-password"
              required 
            />
            <button type="button" id="togglePasswordBtn" class="toggle-password" title="Show/Hide Password" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Forgot Password Link -->
        <div id="groupAux" class="form-aux">
          <a href="#" id="forgotPasswordLink" class="auth-link">Forgot Password?</a>
        </div>

        <!-- Primary Submit Button -->
        <button type="submit" id="btnLoginSubmit" class="btn-auth-primary">
          Login
        </button>

        <!-- Divider -->
        <div id="groupDivider" class="auth-divider">
          <span>OR</span>
        </div>

        <!-- Google OAuth -->
        <div id="groupGoogle">
          <button type="button" id="btnGoogleAuth" class="btn-auth-google">
            <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.27v3.13C3.26 21.3 7.35 24 12 24Z"/>
              <path fill="#FBBC05" d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.61H1.27C.46 8.23 0 10.06 0 12s.46 3.77 1.27 5.39l4.01-3.13Z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.7 1.27 6.61l4.01 3.13c.95-2.84 3.6-4.99 6.72-4.99Z"/>
            </svg>
            Continue with Google
          </button>
        </div>
      </form>

      <!-- Footer switch to Sign Up -->
      <div id="groupFooter" class="auth-card-footer">
        <span>Need an account?</span>
        <a href="#" id="toggleModeLink" class="auth-link-bold">Sign Up</a>
      </div>
    </div>
  </main>

  <!-- App Auth Scripts (Absolute Root Paths) -->
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
